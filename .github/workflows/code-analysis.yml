name: code-analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  CodeQL-Build:
    runs-on: ubuntu-24.04

    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure
        uses: ./.github/actions/configure-linux
        with:
          # Analyse our code (the engine, the format readers and the tests),
          # not the fetched libraries': build those before CodeQL starts.
          configure_options: -DTETRISPACK_TESTS=ON

      - name: Build third-party libraries
        run: cmake --build build --parallel --target SDL2-static SDL2main lua_static

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: security-and-quality
          build-mode: manual

      - name: Build
        run: cmake --build build --parallel

      # Analyse, keep only our own code's results (the fetched libraries in
      # .deps/ are compiled in, so CodeQL sees them too), then upload.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: sarif-results

      - name: Leave out third-party code
        run: python3 -I tools/filter_sarif.py sarif-results .deps/

      - name: Upload the results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results
