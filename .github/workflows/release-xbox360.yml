name: release-xbox360

on: [workflow_dispatch, workflow_call]

# tetrispack.xex with xsdk on a hosted runner (see ci-build.yml), packaged
# with its content and an empty data/ for the player's TETRIS.EXE.
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Version
      run: echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
    - name: Build and package
      uses: ./.github/actions/build-xbox360
      with:
        zip: dist/tetrispack-xbox360-${{ env.VERSION }}.zip
    - name: Upload
      uses: actions/upload-artifact@v6
      with:
        name: tetrispack-xbox360-release
        if-no-files-found: error
        path: dist/*.zip
