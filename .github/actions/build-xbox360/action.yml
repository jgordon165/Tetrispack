name: build-xbox360
description: build tetrispack.xex with xsdk (openpak/x360-sdk) on Linux, as Meguarace does, and package it with its content

inputs:
  xsdk_ref:
    description: the openpak/x360-sdk commit to build with
    required: false
    default: bcbb0e7eeff4bae59f9882209e3edf5affc96767
  zip:
    description: the package to write
    required: false
    default: dist/tetrispack-xbox360.zip

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5
      with:
        repository: openpak/x360-sdk
        ref: ${{ inputs.xsdk_ref }}
        path: xsdk

    - name: Toolchain build tools
      shell: bash
      run: |
        sudo apt-get update -q
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q ninja-build zip python3 \
          libgmp-dev libmpfr-dev libmpc-dev libisl-dev texinfo bison flex

    # Restored and saved as separate steps, so a toolchain once built is kept
    # even when a later step fails. Building it (GCC, binutils, newlib for
    # the console's PowerPC) takes about an hour, once.
    - name: Cached toolchain
      id: gcc
      uses: actions/cache/restore@v4
      with:
        path: ~/xsdk-gcc
        key: xsdk-gcc-${{ hashFiles('xsdk/tools/toolchain/**') }}
    - name: Build the toolchain
      if: steps.gcc.outputs.cache-hit != 'true'
      shell: bash
      run: |
        JOBS=$(nproc) bash xsdk/tools/toolchain/build.sh || { tail -n 80 ~/xsdk-gcc-work/logs/*.log; exit 1; }
    - name: Keep the toolchain
      if: steps.gcc.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/xsdk-gcc
        key: xsdk-gcc-${{ hashFiles('xsdk/tools/toolchain/**') }}

    - name: Build libxsdk
      shell: bash
      run: make -C xsdk -j$(nproc) build/libxsdk.a

    - name: Build tetrispack.xex
      shell: bash
      run: |
        cmake -S consoles/xbox360 -B build-xex -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$PWD/xsdk/cmake/xsdk.cmake -DXSDK_TOOLCHAIN=$HOME/xsdk-gcc
        cmake --build build-xex
        ls -la build-xex/tetrispack.xex

    # The content: the scripts, the songs rendered ahead of time and the
    # sound effects, made by the PC build's music tool.
    - name: Configure host tools
      uses: ./.github/actions/configure-linux
    - name: Build the music tool
      shell: bash
      run: cmake --build build --parallel --target tetrispack_render_music
    - name: Package
      shell: bash
      run: consoles/xbox360/package.sh build-xex/tetrispack.xex "${{ inputs.zip }}"
