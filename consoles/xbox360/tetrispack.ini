; Tetrispack for the Xbox 360: settings, next to tetrispack.xex.

[xbox360]
; Where Menu > Exit goes.
;   dashboard   the console's default dashboard (the stock one, or Aurora /
;               FreeStyle if DashLaunch makes it the default)
;   a .xex      any dashboard or app, on a USB stick or the hard drive:
;                 Usb0:\  Usb1:\  Usb2:\   the USB drives (Usb:\ is Usb0:\)
;                 Hdd:\                    the hard drive
;                 game:\                   this folder (game:\..\ is the one above)
;               If the .xex isn't there, Exit goes to the dashboard.
exit = dashboard
; exit = Usb0:\Aurora\default.xex
; exit = Hdd:\Aurora\default.xex

; The menu shows "Exit to <name>": the .xex's folder (Aurora) unless named here.
; exit_name = Aurora
